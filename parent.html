<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabyMonitor - Hệ thống giám sát bé thông minh</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-primary: #3b82f6;
      --accent-success: #10b981;
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .main-wrapper {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-weight: 800;
      font-size: 2.5rem;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 40px;
      font-size: 1.1rem;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      margin: 0 auto;
    }

    /* Diagnostics card layout removed */

    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #93c5fd;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      padding: 14px 20px;
      border-radius: 14px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
    }

    button {
      padding: 14px 24px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary) 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(59, 130, 246, 0.6);
    }

    #videoContainer {
      width: 100%;
      aspect-ratio: 4/3;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-video {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      position: absolute;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      font-size: 0.9rem;
      margin-top: 15px;
      align-self: flex-start;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 1.5s infinite;
    }

    .status-connected .status-dot {
      background: var(--accent-success);
      box-shadow: 0 0 8px var(--accent-success);
    }

    #logs {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 15px;
      font-family: monospace;
      font-size: 0.85rem;
      height: 250px;
      overflow-y: auto;
      color: #38bdf8;
      margin-top: 20px;
      width: 100%;
      text-align: left;
    }

    .log-line {
      margin-bottom: 4px;
      border-left: 2px solid #3b82f6;
      padding-left: 8px;
    }

    .log-error {
      color: #ef4444;
      border-left-color: #ef4444;
    }

    .log-success {
      color: #10b981;
      border-left-color: #10b981;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .control-panel {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      width: 100%;
    }

    .btn-success {
      background: linear-gradient(135deg, var(--accent-success) 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 10px 0 rgba(16, 185, 129, 0.3);
    }

    .btn-success:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 15px 0 rgba(16, 185, 129, 0.4);
    }

    .btn-muted {
      background: #374151;
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
    }

    .btn-muted:hover {
      background: #4b5563;
      transform: translateY(-1px);
    }
    
    @keyframes alertFlash {
      0% { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
      50% { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
      100% { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
    }
    .flashing-bg {
      animation: alertFlash 1s infinite !important;
    }
    @keyframes slideDown {
      from { transform: translate(-50%, -100px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    /* Light Theme Styling Overrides */
    body.light-theme {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(15, 23, 42, 0.08);
      --text-main: #0f172a;
      --text-muted: #475569;
    }
    body.light-theme input:not([type="radio"]):not([type="checkbox"]) {
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      border: 1px solid rgba(15, 23, 42, 0.15);
    }
    body.light-theme input::placeholder {
      color: #94a3b8;
    }
    body.light-theme #logs {
      background: rgba(255, 255, 255, 0.85);
      color: #0369a1;
      border: 1px solid rgba(15, 23, 42, 0.1);
    }
    body.light-theme .log-line {
      border-left-color: #0284c7;
    }
    body.light-theme #videoContainer {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(15, 23, 42, 0.1);
    }
    body.light-theme .card-title {
      color: #1e3a8a;
    }
    body.light-theme .status-badge {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #334155;
    }
    body.light-theme #vitalsPanel > div {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.show {
      display: flex;
      opacity: 1;
    }
    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      width: 90%;
      max-width: 440px;
      padding: 30px;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.5);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #f8fafc;
    }
    .modal-overlay.show .modal-card {
      transform: scale(1);
    }
    
    body.light-theme .modal-card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #0f172a;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }

    .modal-header {
      margin-bottom: 24px;
    }
    .modal-title {
      font-size: 1.4rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .settings-section {
      margin-bottom: 20px;
      text-align: left;
    }
    .section-label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    body.light-theme .section-label {
      color: #64748b;
    }
    .section-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    body.light-theme .section-desc {
      color: #64748b;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 5px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 1rem;
      user-select: none;
      color: var(--text-main);
    }
    .radio-label input {
      display: none;
    }
    .radio-custom {
      width: 20px;
      height: 20px;
      border: 2px solid var(--text-muted);
      border-radius: 50%;
      display: inline-block;
      position: relative;
      transition: all 0.2s ease;
    }
    body.light-theme .radio-custom {
      border-color: #cbd5e1;
    }
    .radio-label input:checked + .radio-custom {
      border-color: var(--accent-primary);
    }
    .radio-custom::after {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--accent-primary);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.2s ease;
    }
    .radio-label input:checked + .radio-custom::after {
      transform: translate(-50%, -50%) scale(1);
    }
    
    .toggle-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Toggle switch styles */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #4b5563;
      transition: .3s;
    }
    body.light-theme .slider {
      background-color: #cbd5e1;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
    }
    input:checked + .slider {
      background-color: #06b6d4; /* teal matching screenshot */
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    .slider.round {
      border-radius: 24px;
    }
    .slider.round:before {
      border-radius: 50%;
    }

    .custom-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      padding: 12px;
      border-radius: 14px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    body.light-theme .custom-select {
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      border: 1px solid rgba(15, 23, 42, 0.15);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 24px;
    }
    .btn-text {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn-text:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    body.light-theme .btn-text:hover {
      background: rgba(0, 0, 0, 0.05);
      color: #475569;
    }
    .btn-save {
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      color: white;
      border: none;
      padding: 10px 24px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(139, 92, 246, 0.4);
    }
    .btn-muted {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }
    .btn-muted:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- Controls Header -->
  <div style="position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; gap: 10px;">
    <button id="settingsBtn" class="btn-muted" style="padding: 8px 14px; font-size: 0.85rem; border-radius: 10px;">
      ⚙️ Cài đặt
    </button>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title" data-i18n="settings_title">⚙️ Cài đặt ứng dụng</span>
      </div>
      <div class="modal-body">
        <!-- Language Option -->
        <div class="settings-section">
          <label class="section-label" data-i18n="label_lang">Ngôn ngữ</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="langOption" value="en">
              <span class="radio-custom"></span>
              English
            </label>
            <label class="radio-label">
              <input type="radio" name="langOption" value="vi" checked>
              <span class="radio-custom"></span>
              Tiếng Việt
            </label>
          </div>
        </div>



        <!-- Alarm Volume slider -->
        <div class="settings-section">
          <label class="section-label" data-i18n="label_volume">Âm lượng báo động</label>
          <div style="display: flex; align-items: center; gap: 15px; margin-top: 5px;">
            <input type="range" id="settingAlarmVolume" min="0" max="1" step="0.1" value="0.4" style="flex: 1; padding: 0; margin: 0; background: transparent;">
            <span id="volumeVal" style="width: 45px; text-align: right; font-weight: bold;">40%</span>
          </div>
        </div>

        <!-- Snooze duration -->
        <div class="settings-section">
          <label class="section-label" data-i18n="label_snooze">Thời gian tạm tắt</label>
          <select id="settingSnoozeDuration" class="custom-select" style="margin-top: 5px;">
            <option value="10000">10s</option>
            <option value="30000" selected>30s</option>
            <option value="60000">1m</option>
            <option value="120000">2m</option>
          </select>
        </div>

        <!-- Keep Screen On Toggle -->
        <div class="settings-section toggle-section">
          <div style="flex: 1; padding-right: 15px;">
            <label class="section-label" style="margin-bottom: 2px;" data-i18n="label_screen_on">Giữ màn hình luôn bật</label>
            <p class="section-desc" data-i18n="desc_screen_on">Ngăn màn hình tắt trong khi giám sát</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="settingKeepScreenOn" checked>
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button id="settingsCancelBtn" class="btn-text" data-i18n="btn_cancel">HỦY</button>
        <button id="settingsSaveBtn" class="btn-save" data-i18n="btn_save">LƯU</button>
      </div>
    </div>
  </div>

  <!-- Floating Alert Overlay -->
  <div id="alertOverlay" style="display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; background: rgba(220, 38, 38, 0.95); border: 2px solid #ef4444; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 9999; animation: slideDown 0.4s ease-out; backdrop-filter: blur(10px); color: white;">
    <div style="display: flex; align-items: center; gap: 15px;">
      <div style="font-size: 2.5rem; animation: pulse 1s infinite;">🚨</div>
      <div style="flex: 1;">
        <h3 id="alertTitle" style="font-weight: 800; font-size: 1.2rem; color: white; margin-bottom: 5px;" data-i18n="alert_title_emergency">CẢNH BÁO KHẨN CẤP</h3>
        <p id="alertMessage" style="font-size: 1rem; color: #fee2e2; line-height: 1.4;" data-i18n="alert_msg_missing">Không phát hiện em bé trong camera!</p>
      </div>
      <button id="dismissAlertBtn" style="background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; border-radius: 10px; font-size: 0.9rem; color: white; cursor: pointer; font-weight: 600; transition: background 0.2s;" data-i18n="alert_dismiss">Đã rõ</button>
    </div>
  </div>

  <div class="main-wrapper">
    <h1 data-i18n="title">BabyMonitor</h1>
    <p class="subtitle" data-i18n="subtitle">Hệ thống giám sát và chăm sóc bé thông minh từ xa</p>
    
    <div class="container">
    <!-- Camera View & Status -->
    <div class="card">
      <div>
        <div class="card-title">
          <span data-i18n="camera_title">🎥 Camera Monitor</span>
        </div>
        

        <div class="input-group" style="display: flex; gap: 8px; width: 100%;">
          <div style="position: relative; flex: 1; display: flex; align-items: center;">
            <input type="password" id="babyIdInput" maxlength="6" placeholder="Nhập mã 6 chữ số" data-i18n-placeholder="baby_id_placeholder" style="width: 100%; padding-right: 75px; margin-bottom: 0;">
            <div style="position: absolute; right: 10px; display: flex; gap: 8px; align-items: center;">
              <button id="toggleVisibleBtn" type="button" style="background: transparent; border: none; padding: 4px; font-size: 1.1rem; cursor: pointer; color: var(--text-muted); width: auto; display: inline-flex;">👁️</button>
              <button id="randomCodeBtn" type="button" style="background: transparent; border: none; padding: 4px; font-size: 1.1rem; cursor: pointer; color: var(--text-muted); width: auto; display: inline-flex;">🎲</button>
            </div>
          </div>
          <button id="connectBtn" class="btn-primary" data-i18n="connect_camera">Kết nối Camera</button>
        </div>


        <div id="videoContainer">
          <div class="no-video" id="videoPlaceholder" data-i18n="video_placeholder">Đang chờ kết nối Camera...</div>
          <video id="remoteVideo" autoplay playsinline controls></video>
        </div>

        <!-- Bảng điều khiển Mic/Loa -->
        <div class="control-panel" id="controlPanel" style="display: none;">
          <button id="micBtn" class="btn-success" style="flex: 1; padding: 10px 16px; font-size: 0.9rem; border-radius: 10px;" data-i18n="mic_on">🎙️ Tắt Mic</button>
          <button id="speakerBtn" class="btn-success" style="flex: 1; padding: 10px 16px; font-size: 0.9rem; border-radius: 10px;" data-i18n="speaker_on">🔊 Tắt Loa</button>
        </div>

        <!-- Bảng điều khiển Lullaby -->
        <div class="control-panel" id="lullabyPanel" style="display: none; align-items: center; gap: 8px;">
          <select id="lullabySelect" class="custom-select" style="flex: 2; padding: 10px;">
            <option value="rungu_1">Giấc Ngủ Ngon Của Em Bé</option>
            <option value="rungu2">Ru Con Êm Dịu</option>
            <option value="rungu3">Hát Ru Bé Ngủ</option>
            <option value="rungu4">Đàn Ru Bé Khó Ngủ</option>
            <option value="rungu5">Cho Bé Nghe Nín Khóc</option>
            <option value="rungu6">Bé Ngủ Ngon Mỗi Đêm</option>
            <option value="rungu7">Giấc Ngủ Ngon Của Em Bé 2</option>
          </select>
          <button id="lullabyPlayBtn" class="btn-success" style="flex: 1; padding: 10px; border-radius: 10px;" data-i18n="lullaby_play">🎵 Phát</button>
          <button id="lullabyStopBtn" style="flex: 1; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 10px; font-weight: bold;" data-i18n="lullaby_stop">🔇 Tắt</button>
        </div>

        <!-- Bảng điều khiển Timer -->
        <div class="control-panel" id="timerPanel" style="display: none; align-items: center; gap: 8px;">

    function applyLanguage(lang) {
      const t = translations[lang] || translations['vi'];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key]) el.setAttribute('placeholder', t[key]);
      });
      document.title = t.title;
      
      // Update dynamic elements
      if (vitalSleep.innerText.includes('ngủ') || vitalSleep.innerText.includes('Sleep')) {
        vitalSleep.innerText = t.sleep_state_sleeping;
      } else if (vitalSleep.innerText.includes('Thức') || vitalSleep.innerText.includes('Awake')) {
        vitalSleep.innerText = t.sleep_state_awake;
      }

      // Dev mode button removed
      
      // status text
      if (!socket || !socket.connected) {
        statusText.textContent = t.status_disconnected;
      }
    }

    // Wake Lock
    async function toggleWakeLock(enable) {
      if (enable) {
        if ('wakeLock' in navigator) {
          try {
            if (!wakeLock) {
              wakeLock = await navigator.wakeLock.request('screen');
              console.log('Screen Wake Lock is active');
            }
          } catch (err) {
            console.warn(`Wake Lock error: ${err.message}`);
          }
        }
      } else {
        if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
          console.log('Screen Wake Lock released');
        }
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && settings.keepScreenOn) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
          console.error(err);
        }
      }
    });

    // Load / Save Settings
    function loadSettings() {
      const stored = localStorage.getItem('baby_monitor_settings_parent');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          settings = { ...settings, ...parsed };
        } catch (e) {
          console.error(e);
        }
      }

      // Update UI inputs
      document.querySelectorAll('input[name="langOption"]').forEach(radio => {
        radio.checked = (radio.value === settings.lang);
      });
      // Apply settings
      settings.serverUrl = defaultServerUrl;
      volumeSlider.value = settings.alarmVolume;
      volumeVal.textContent = Math.round(settings.alarmVolume * 100) + '%';
      document.getElementById('settingSnoozeDuration').value = settings.snoozeDuration;
      document.getElementById('settingKeepScreenOn').checked = settings.keepScreenOn;

      applyLanguage(settings.lang);
      toggleWakeLock(settings.keepScreenOn);
    }

    function saveSettings() {
      const lang = document.querySelector('input[name="langOption"]:checked').value;
      const alarmVolume = parseFloat(volumeSlider.value);
      const snoozeDuration = parseInt(document.getElementById('settingSnoozeDuration').value);
      const keepScreenOn = document.getElementById('settingKeepScreenOn').checked;

      settings = { lang, serverUrl: defaultServerUrl, alarmVolume, snoozeDuration, keepScreenOn };
      localStorage.setItem('baby_monitor_settings_parent', JSON.stringify(settings));

      // Apply
      applyLanguage(settings.lang);
      toggleWakeLock(settings.keepScreenOn);

      closeModal();
    }

    function openModal() {
      loadSettings();
      settingsModal.classList.add('show');
    }

    function closeModal() {
      settingsModal.classList.remove('show');
    }

    // Modal listeners
    settingsBtn.addEventListener('click', openModal);
    settingsCancelBtn.addEventListener('click', closeModal);
    settingsSaveBtn.addEventListener('click', saveSettings);
    volumeSlider.addEventListener('input', (e) => {
      volumeVal.textContent = Math.round(e.target.value * 100) + '%';
    });

    function initSocket(url) {
      if (socket) {
        socket.disconnect();
        socket = null;
      }
      const t = translations[settings.lang] || translations['vi'];
      console.log('[Socket] Connecting to:', url);
      addLog(`${t.log_connecting}${url}`, 'info');
      socket = io(url, {
        reconnection: true,
        transports: ['websocket']
      });
      attachSocketListeners();
    }

    function addLog(message, type = 'info') {
      console.log(`[${type.toUpperCase()}] ${message}`);
      if (!logsContainer) return;
      const line = document.createElement('div');
      line.className = 'log-line';
      if (type === 'error') line.className += ' log-error';
      if (type === 'success') line.className += ' log-success';
      const time = new Date().toLocaleTimeString();
      line.innerText = `[${time}] ${message}`;
      logsContainer.appendChild(line);
      logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    function startTitleFlash(alertTitleText) {
      if (titleFlashInterval) clearInterval(titleFlashInterval);
      let isAlertTitle = true;
      const originalTitle = translations[settings.lang]?.title || "BabyMonitor";
      titleFlashInterval = setInterval(() => {
        document.title = isAlertTitle ? alertTitleText : originalTitle;
        isAlertTitle = !isAlertTitle;
      }, 1000);
    }

    function stopTitleFlash() {
      if (titleFlashInterval) {
        clearInterval(titleFlashInterval);
        titleFlashInterval = null;
      }
      const t = translations[settings.lang] || translations['vi'];
      document.title = t.title;
    }

    function startDisconnectTimeout() {
      if (!isMonitoring) return;
      if (disconnectTimeout) return;
      const t = translations[settings.lang] || translations['vi'];
      disconnectTimeout = setTimeout(() => {
        isConnectionLostAlert = true;
        showAlert(t.alert_disconnect_title, t.alert_disconnect_msg, true, 'missing');
      }, 10000);
    }

    function stopDisconnectTimeout() {
      if (disconnectTimeout) {
        clearTimeout(disconnectTimeout);
        disconnectTimeout = null;
      }
      if (isConnectionLostAlert) {
        dismissAlert();
      }
    }

    function playAlarmSound() {
      try {
        if (!alarmAudioCtx) {
          alarmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (alarmAudioCtx.state === 'suspended') {
          alarmAudioCtx.resume();
        }
        const osc = alarmAudioCtx.createOscillator();
        const gain = alarmAudioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, alarmAudioCtx.currentTime); 
        gain.gain.setValueAtTime(settings.alarmVolume, alarmAudioCtx.currentTime);
        osc.connect(gain);
        gain.connect(alarmAudioCtx.destination);
        osc.start();
        osc.stop(alarmAudioCtx.currentTime + 0.15); 
      } catch (e) {
        console.warn('Cannot play beep sound:', e);
      }
    }

    function startAlarm() {
      if (alarmInterval) return;
      playAlarmSound();
      alarmInterval = setInterval(playAlarmSound, 800);
    }

    function stopAlarm() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    function showAlert(title, message, isEmergency = true, alertType = null) {
      currentActiveAlertType = alertType;
      alertTitle.innerText = title;
      alertMessage.innerText = message;
      alertOverlay.style.display = 'block';
      if (isEmergency) {
        document.body.classList.add('flashing-bg');
        startAlarm();
        startTitleFlash(title);
      }
    }

    function dismissAlert() {
      const t = translations[settings.lang] || translations['vi'];
      alertOverlay.style.display = 'none';
      document.body.classList.remove('flashing-bg');
      stopAlarm();
      stopTitleFlash();
      
      if (isConnectionLostAlert) {
        isMonitoring = false;
      }
      isConnectionLostAlert = false;
      
      if (currentActiveAlertType) {
        alertSnoozeUntil[currentActiveAlertType] = Date.now() + settings.snoozeDuration;
        const secs = settings.snoozeDuration / 1000;
        const msg = settings.lang === 'vi' 
          ? `🔇 Đã tạm tắt báo động "${currentActiveAlertType}" trong ${secs} giây.` 
          : `🔇 Snoozed "${currentActiveAlertType}" alarm for ${secs} seconds.`;
        addLog(msg, 'success');
        currentActiveAlertType = null;
      }
    }

    function attachSocketListeners() {
      const t = translations[settings.lang] || translations['vi'];

      socket.onAny((eventName, ...args) => {
        if (!['webrtc_ice_candidate','ice_candidate','webrtc_offer','webrtc_answer'].includes(eventName)) {
          addLog(`[DEBUG] Event: "${eventName}" → ${JSON.stringify(args[0] || {}).substring(0, 100)}`, 'info');
        }
      });

      socket.on('connect', () => {
        const connMsg = settings.lang === 'vi' ? 'Đã kết nối thành công tới máy chủ Socket.IO' : 'Successfully connected to Socket.IO server';
        addLog(connMsg, 'success');
        stopDisconnectTimeout();
        const babyId = babyIdInput.value.trim() || '70';
        const autoRoom = `baby_${babyId}`;
        currentRoomId = autoRoom;
        socket.emit('join_baby_room', { room: currentRoomId, role: 'viewer', name: 'Parent PC (Auto)' });
        const joinMsg = settings.lang === 'vi' ? `Đã tự động join phòng ${currentRoomId} để nhận cảnh báo.` : `Auto-joined room ${currentRoomId} for alerts.`;
        addLog(joinMsg, 'success');
      });

      socket.on('disconnect', () => {
        const disconnMsg = settings.lang === 'vi' ? '⚠️ Mất kết nối tới máy chủ Socket.IO!' : '⚠️ Disconnected from Socket.IO server!';
        addLog(disconnMsg, 'error');
        startDisconnectTimeout();
      });

      socket.on('webrtc_offer', async (data) => {
        if (!data.sdp) return;
        
        stopDisconnectTimeout();
        addLog(t.log_sdp_offer);
        currentBabySocketId = data.sender_socket_id;
        
        try {
          peerConnection = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
          });

          if (localStream) {
            const addMicMsg = settings.lang === 'vi' ? "Đang thêm luồng Microphone của PC vào PeerConnection..." : "Adding PC Microphone stream to PeerConnection...";
            addLog(addMicMsg);
            localStream.getTracks().forEach(track => {
              peerConnection.addTrack(track, localStream);
            });
          }

          peerConnection.oniceconnectionstatechange = () => {
            addLog(`ICE Connection State: ${peerConnection.iceConnectionState}`);
            statusText.innerText = `ICE State: ${peerConnection.iceConnectionState}`;
            if (peerConnection.iceConnectionState === 'connected' || peerConnection.iceConnectionState === 'completed') {
              statusBadge.className = 'status-badge status-connected';
              statusText.innerText = t.status_monitoring;
            } else if (peerConnection.iceConnectionState === 'failed' || peerConnection.iceConnectionState === 'disconnected') {
              statusBadge.className = 'status-badge';
            }
          };

          peerConnection.onsignalingstatechange = () => {
            addLog(`Signaling State: ${peerConnection.signalingState}`);
          };

          peerConnection.ontrack = (event) => {
            const trackMsg = settings.lang === 'vi' 
              ? `🟢 Nhận được track từ Baby: ${event.track.kind}` 
              : `🟢 Received track from Baby: ${event.track.kind}`;
            addLog(trackMsg, 'success');
            
            if (!remoteVideo.srcObject) {
              remoteVideo.srcObject = new MediaStream();
            }
            
            const currentStream = remoteVideo.srcObject;
            const trackExists = currentStream.getTracks().some(t => t.id === event.track.id);
            if (!trackExists) {
              currentStream.addTrack(event.track);
              const trackAddedMsg = settings.lang === 'vi' ? `Đã tích hợp track ${event.track.kind} vào luồng phát.` : `Integrated track ${event.track.kind} into stream.`;
              addLog(trackAddedMsg, 'info');
            }
            
            videoPlaceholder.style.display = 'none';

            remoteVideo.play()
              .then(() => {
                const playMsg = settings.lang === 'vi' ? '▶️ Luồng video/audio đang phát thành công.' : '▶️ Video/audio streaming started.';
                addLog(playMsg, 'success');
              })
              .catch(err => {
                const playErr = settings.lang === 'vi'
                  ? `⚠️ Trình duyệt chặn phát âm thanh tự động: ${err.message}. Nhấp click vào video để bật tiếng!`
                  : `⚠️ Autoplay blocked: ${err.message}. Click the video to enable sound!`;
                addLog(playErr, 'error');
              });
          };

          peerConnection.onicecandidate = (event) => {
            if (event.candidate && currentBabySocketId) {
              socket.emit('webrtc_ice_candidate', {
                room: currentRoomId,
                target_socket_id: currentBabySocketId,
                sender_socket_id: socket.id,
                candidate: event.candidate
              });
              socket.emit('ice_candidate', {
                room: currentRoomId,
                target_socket_id: currentBabySocketId,
                sender_socket_id: socket.id,
                candidate: event.candidate
              });
            }
          };

          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          socket.emit('webrtc_answer', {
            room: currentRoomId,
            target_socket_id: currentBabySocketId,
            sender_socket_id: socket.id,
            sdp: peerConnection.localDescription
          });
        } catch (err) {
          addLog(`Lỗi xử lý Offer: ${err.message}`, 'error');
        }
      });

      socket.on('webrtc_ice_candidate', async (data) => {
        const candidate = data?.candidate || data;
        if (peerConnection && candidate) {
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
          } catch (err) {
            console.error(err);
          }
        }
      });

      socket.on('ice_candidate', async (data) => {
        const candidate = data?.candidate || data;
        if (peerConnection && candidate) {
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
          } catch (err) {
            console.error(err);
          }
        }
      });

      socket.on('baby_status_change', (data) => {
        const stateMsg = settings.lang === 'vi' ? `Trạng thái Baby thay đổi: ${data.status}` : `Baby status changed: ${data.status}`;
        addLog(stateMsg);
        if (data.status === 'offline') {
          remoteVideo.srcObject = null;
          videoPlaceholder.style.display = 'flex';
          videoPlaceholder.innerText = settings.lang === 'vi' ? 'Thiết bị Baby đã ngắt kết nối.' : 'Baby device disconnected.';
          if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
          }
          startDisconnectTimeout();
        } else {
          stopDisconnectTimeout();
        }
      });

      socket.on('baby_cry_alert', (data) => {
        const alertType = 'cry';
        const rawMsg = data?.message || (settings.lang === 'vi' ? 'Bé đang khóc!' : 'Baby is crying!');
        const cryLog = settings.lang === 'vi' ? `🚨 BÁO ĐỘNG TIẾNG BÉ KHÓC: ${rawMsg}` : `🚨 BABY CRY ALERT: ${rawMsg}`;
        addLog(cryLog, 'error');
        if (Date.now() < (alertSnoozeUntil[alertType] || 0)) {
          return;
        }
        document.title = settings.lang === 'vi' ? '🚨 BÉ ĐANG KHÓC!' : '🚨 BABY IS CRYING!';
        showAlert(settings.lang === 'vi' ? '🚨 BÉ ĐANG KHÓC' : '🚨 BABY CRYING', rawMsg, true, alertType);
      });

      socket.on('activity_alert', (data) => {
        const msg = data.message || '';
        const alertType = data.alert_type || 'activity';
        const actLog = settings.lang === 'vi' ? `🔔 CẢNH BÁO HOẠT ĐỘNG: ${msg}` : `🔔 ACTIVITY ALERT: ${msg}`;
        addLog(actLog, 'warning');
        
        if (Date.now() < (alertSnoozeUntil[alertType] || 0)) {
          return;
        }
        
        if (alertType === 'missing' || msg.startsWith('missing:')) {
          const cleanMsg = msg.replace('missing:', '').trim() || (settings.lang === 'vi' ? 'Không phát hiện em bé trong camera!' : 'Baby not detected in camera view!');
          document.title = settings.lang === 'vi' ? '🚨 BÉ NGOÀI CAMERA!' : '🚨 BABY OUT OF CAMERA!';
          showAlert(settings.lang === 'vi' ? '🚨 BÉ NGOÀI CAMERA' : '🚨 BABY OUT OF VIEW', cleanMsg, true, 'missing');
          
          vitalBreathing.innerText = '--';
          vitalBreathing.style.color = '#94a3b8';
        } else if (alertType === 'apnea' || msg.startsWith('apnea:')) {
          const cleanMsg = msg.replace('apnea:', '').trim() || (settings.lang === 'vi' ? 'Phát hiện ngưng thở bất thường!' : 'Abnormal apnea detected!');
          document.title = settings.lang === 'vi' ? '🚨 CẢNH BÁO NGƯNG THỞ!' : '🚨 APNEA WARNING!';
          showAlert(settings.lang === 'vi' ? '🚨 CẢNH BÁO NGƯNG THỞ' : '🚨 APNEA DETECTED', cleanMsg, true, 'apnea');
          
          vitalBreathing.innerText = '0 bpm';
          vitalBreathing.style.color = '#ef4444';
        } else {
          showAlert(settings.lang === 'vi' ? '🔔 CẢNH BÁO HOẠT ĐỘNG' : '🔔 ACTIVITY ALERT', msg, false, 'activity');
        }
      });

      socket.on('baby_breathing_update', (data) => {
        const rate = typeof data === 'object' ? data.rate : data;
        const breathingLog = settings.lang === 'vi' ? `Nhận nhịp thở: ${rate} bpm` : `Received breathing rate: ${rate} bpm`;
        addLog(breathingLog);
        
        if (rate === -1) {
          vitalBreathing.innerText = '--';
          vitalBreathing.style.color = '#94a3b8';
        } else if (rate === 0) {
          vitalBreathing.innerText = '0 bpm';
          vitalBreathing.style.color = '#ef4444';
        } else {
          vitalBreathing.innerText = `${rate} bpm`;
          vitalBreathing.style.color = '#10b981';
          
          if (currentActiveAlertType === 'missing') {
            const recoveryLog = settings.lang === 'vi' ? "🟢 Phát hiện bé đã quay lại khung hình, tự động tắt cảnh báo." : "🟢 Baby detected back in view, auto-dismissing alert.";
            addLog(recoveryLog, "success");
            dismissAlert();
          }
        }
      });

      socket.on('baby_sleep_state_change', (data) => {
        const state = typeof data === 'object' ? data.state : data;
        const sleepLog = settings.lang === 'vi' ? `Nhận trạng thái giấc ngủ: ${state}` : `Received sleep status: ${state}`;
        addLog(sleepLog);
        
        if (state === 'sleeping') {
          vitalSleep.innerText = t.sleep_state_sleeping;
          vitalSleep.style.color = '#a78bfa';
          if (lastBabySleepState !== 'sleeping') {
            lastBabySleepState = 'sleeping';
          }
        } else {
          vitalSleep.innerText = t.sleep_state_awake;
          vitalSleep.style.color = '#f59e0b';
          if (lastBabySleepState === 'sleeping' || lastBabySleepState === null) {
            lastBabySleepState = 'awake';
          }
        }
      });
    }

    function toggleMic() {
      if (!localStream) {
        const errStr = settings.lang === 'vi' ? "Không tìm thấy Microphone cục bộ để tắt/mở!" : "No local Microphone found!";
        addLog(errStr, "error");
        return;
      }
      isMicEnabled = !isMicEnabled;
      localStream.getAudioTracks().forEach(track => {
        track.enabled = isMicEnabled;
      });
      const t = translations[settings.lang] || translations['vi'];
      if (isMicEnabled) {
        micBtn.innerText = t.mic_on;
        micBtn.className = "btn-success";
        const onStr = settings.lang === 'vi' ? "🎙️ Đã BẬT truyền giọng nói của bạn sang Baby." : "🎙️ Microphone transmission enabled.";
        addLog(onStr);
      } else {
        micBtn.innerText = t.mic_off;
        micBtn.className = "btn-muted";
        const offStr = settings.lang === 'vi' ? "🔇 Đã TẮT truyền giọng nói của bạn." : "🔇 Microphone transmission muted.";
        addLog(offStr);
      }
    }

    function toggleSpeaker() {
      const stream = remoteVideo.srcObject;
      if (!stream) {
        const errStr = settings.lang === 'vi' ? "Chưa nhận được âm thanh từ Baby để tắt/mở!" : "No baby audio received yet!";
        addLog(errStr, "error");
        return;
      }
      isSpeakerEnabled = !isSpeakerEnabled;
      stream.getAudioTracks().forEach(track => {
        track.enabled = isSpeakerEnabled;
      });
      const t = translations[settings.lang] || translations['vi'];
      if (isSpeakerEnabled) {
        speakerBtn.innerText = t.speaker_on;
        speakerBtn.className = "btn-success";
        const onStr = settings.lang === 'vi' ? "🔊 Đã BẬT tiếng nghe từ Baby." : "🔊 Speaker output enabled.";
        addLog(onStr);
      } else {
        speakerBtn.innerText = t.speaker_off;
        speakerBtn.className = "btn-muted";
        const offStr = settings.lang === 'vi' ? "🔈 Đã TẮT tiếng nghe từ Baby." : "🔈 Speaker output muted.";
        addLog(offStr);
      }
    }

    micBtn.addEventListener('click', toggleMic);
    speakerBtn.addEventListener('click', toggleSpeaker);
    dismissAlertBtn.addEventListener('click', dismissAlert);

    connectBtn.addEventListener('click', async () => {
      isMonitoring = true;
      const babyId = babyIdInput.value.trim();
      if (!babyId || babyId.length !== 6) {
        const errStr = settings.lang === 'vi' ? "Vui lòng nhập đủ mã 6 chữ số!" : "Please enter a valid 6-digit Baby ID!";
        alert(errStr);
        return;
      }
      localStorage.setItem('baby_monitor_last_baby_id', babyId);
      currentRoomId = `baby_${babyId}`;
      const t = translations[settings.lang] || translations['vi'];
      addLog(`${t.log_joined}${currentRoomId}...`);

      controlPanel.style.display = 'flex';
      lullabyPanel.style.display = 'flex';
      timerPanel.style.display = 'flex';
      vitalsPanel.style.display = 'grid';
      isMicEnabled = true;
      isSpeakerEnabled = true;
      micBtn.innerText = t.mic_on;
      micBtn.className = "btn-success";
      speakerBtn.innerText = t.speaker_on;
      speakerBtn.className = "btn-success";

      try { remoteVideo.play().catch(() => {}); } catch (e) {}

      try {
        const micReqStr = settings.lang === 'vi' ? "Đang yêu cầu quyền truy cập Microphone của PC..." : "Requesting PC Microphone permission...";
        addLog(micReqStr);
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        addLog(t.log_mic_success, "success");
      } catch (err) {
        addLog(`${t.log_mic_fail}${err.message}. Only listening.`, "error");
      }

      socket.emit('join_baby_room', { room: currentRoomId, role: 'viewer', name: 'Parent PC' });
      setTimeout(() => {
        const streamReqStr = settings.lang === 'vi' ? 'Đang gửi yêu cầu stream tới Baby Station...' : 'Sending stream request to Baby Station...';
        addLog(streamReqStr);
        socket.emit('webrtc_request_stream', { room: currentRoomId, viewer_socket_id: socket.id });
      }, 600);
    });

    // Toggle Chế độ kỹ thuật removed

    // Toggle code visibility
    const toggleVisibleBtn = document.getElementById('toggleVisibleBtn');
    const randomCodeBtn = document.getElementById('randomCodeBtn');
    
    toggleVisibleBtn.addEventListener('click', () => {
      if (babyIdInput.type === 'password') {
        babyIdInput.type = 'text';
        toggleVisibleBtn.textContent = '🙈';
      } else {
        babyIdInput.type = 'password';
        toggleVisibleBtn.textContent = '👁️';
      }
    });

    randomCodeBtn.addEventListener('click', () => {
      const code = Math.floor(100000 + Math.random() * 900000).toString();
      babyIdInput.value = code;
      localStorage.setItem('baby_monitor_last_baby_id', code);
      addLog(`Generated random Room ID: ${code}`);
    });

    // Load initial settings and run
    loadSettings();
    
    // Check URL for room parameter (QR Code auto-join)
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');
    
    let initialBabyId = roomFromUrl;
    if (!initialBabyId) {
      initialBabyId = localStorage.getItem('baby_monitor_last_baby_id') || Math.floor(100000 + Math.random() * 900000).toString();
    }
    
    babyIdInput.value = initialBabyId;
    localStorage.setItem('baby_monitor_last_baby_id', initialBabyId);
    initSocket(settings.serverUrl);
    
    // Auto click connect if room was provided in URL
    if (roomFromUrl) {
      setTimeout(() => {
        if (connectBtn && !isMonitoring) {
          connectBtn.click();
        }
      }, 500);
    }
    
    // Lullaby Logic
    lullabyPlayBtn.addEventListener('click', () => {
      const songId = lullabySelect.value;
      const songName = lullabySelect.options[lullabySelect.selectedIndex].text;
      if (socket && currentRoomId) {
        socket.emit('play_lullaby', { room: currentRoomId, song_id: songId });
        addLog(settings.lang === 'vi' ? `🎵 Đã gửi yêu cầu phát nhạc: ${songId}` : `🎵 Sent play lullaby request: ${songId}`, 'success');
      }
    });

    lullabyStopBtn.addEventListener('click', () => {
      if (socket && currentRoomId) {
        socket.emit('stop_lullaby', { room: currentRoomId });
        addLog(settings.lang === 'vi' ? '🔇 Đã gửi yêu cầu tắt nhạc' : '🔇 Sent stop lullaby request', 'info');
      }
    });

    // Timer Logic
    function updateTimerDisplay(secondsLeft) {
      if (secondsLeft <= 0) {
        timerDisplay.style.display = 'none';
        timerInput.style.display = 'block';
        timerStartBtn.style.display = 'block';
        return;
      }
      const m = Math.floor(secondsLeft / 60);
      const s = secondsLeft % 60;
      timerDisplay.innerText = `⏳ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    timerStartBtn.addEventListener('click', () => {
      const minutes = parseInt(timerInput.value);
      if (isNaN(minutes) || minutes <= 0) {
        alert(settings.lang === 'vi' ? 'Vui lòng nhập số phút hợp lệ!' : 'Please enter valid minutes!');
        return;
      }
      
      let secondsLeft = minutes * 60;
      
      timerInput.style.display = 'none';
      timerStartBtn.style.display = 'none';
      timerDisplay.style.display = 'block';
      updateTimerDisplay(secondsLeft);
      
      if (parentTimerInterval) clearInterval(parentTimerInterval);
      
      parentTimerInterval = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay(secondsLeft);
        
        if (secondsLeft <= 0) {
          clearInterval(parentTimerInterval);
          showAlert(
            settings.lang === 'vi' ? '⏰ HẾT GIỜ HẸN!' : '⏰ TIMER FINISHED!',
            settings.lang === 'vi' ? 'Đã đến giờ bạn hẹn để kiểm tra bé!' : 'It is time to check on your baby!',
            true,
            'timer'
          );
        }
      }, 1000);
      
      addLog(settings.lang === 'vi' ? `⏳ Bắt đầu hẹn giờ: ${minutes} phút` : `⏳ Started timer: ${minutes} minutes`, 'success');
    });

  </script>
</body>
</html>
